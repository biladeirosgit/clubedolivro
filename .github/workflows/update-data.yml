name: Update book data

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run pipeline
        run: python scripts/build_book_data.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/cdl/bookData.json src/cdl/goodreadsShelves.json scripts/editionCache.json public/covers
          if git diff --cached --quiet; then
            echo "Nada para commitar."
          else
            git commit -m "chore: update book data (automated)"
            git push
          fi
